[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "kaggleui"
version = "0.2.7"
description = "One-cell control panel for hosting AI models (text, image, video, speech, world) on Kaggle's free GPUs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "UltraFEmotes" }]
keywords = ["kaggle", "llm", "ollama", "vllm", "diffusers", "gradio", "openai", "anthropic", "self-hosting"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "websockets>=12",
  "huggingface_hub>=0.24",
  "psutil>=5.9",
  "pyyaml>=6",
  "python-multipart>=0.0.9",
  "nvidia-ml-py>=12; platform_system == 'Linux'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "openai>=1.40", "anthropic>=0.40"]

[project.scripts]
kaggleui = "kaggleui.cli:main"

[project.urls]
Homepage = "https://github.com/UltraFEmotes/KaggleUI"
Issues = "https://github.com/UltraFEmotes/KaggleUI/issues"

[tool.hatch.build.targets.wheel]
packages = ["kaggleui"]
artifacts = ["kaggleui/static/**"]

[tool.hatch.build.targets.sdist]
include = ["kaggleui", "README.md", "LICENSE", "install.sh"]
artifacts = ["kaggleui/static/**"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B905"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
